version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bepay-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/bepay
      - JWT_SECRET=your_jwt_secret
      - MESTA_API_URL=https://api.stg.mesta.xyz/v1
      - MESTA_API_KEY=${MESTA_API_KEY}
      - MESTA_API_SECRET=${MESTA_API_SECRET}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: bepay-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: bepay-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bepay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
